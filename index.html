<section id="home"><div class="hero"><span class="pill">看例句 → 回想 → 換題練習 → 題幹實戰</span><h1>學測英文作文｜開頭句型</h1><p>不是把答案看完，而是練習回想學過的句型。</p></div>
<div class="portal-return-wrap"><a class="portal-return" href="https://oohya330-glitch.github.io/lulu-english-challenge-map/">← 回到 Lulu 英文挑戰地圖</a></div>
<div class="box" style="margin:0 0 20px"><h2 style="margin-top:0">📌 怎麼練？</h2>
<div class="hint"><b>① 看例句</b>　先看兩句，注意它們共用的句型。<br>
<b>② 先回想，再看答案</b>　看到空格時先回想 5 秒，需要時再查看答案。<br>
<b>③ 換題自己寫</b>　把學過的句型運用到新主題。<br>
<b>④ 題幹實戰</b>　先讀題、自己寫第一句；卡住時才使用提示。</div>
<div class="patternNote"><b>⭐ 建議：</b>不需要一次完成六型。每次練習 1～2 型；六型都學過後，再做「六型總複習」。</div></div>
